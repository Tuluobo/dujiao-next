name: docker

# 镜像发布到本仓库所属账号的 GitHub Packages（GHCR），不再推 Docker Hub。
# 认证用 Actions 自带的 GITHUB_TOKEN，无需任何额外 secret。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 最终运行阶段（alpine + apk add）是在目标架构下执行的，
      # 构建 linux/arm64 时需要 binfmt 模拟；前端与 Go 编译阶段已用
      # --platform=$BUILDPLATFORM 钉在原生架构上，不会走 QEMU。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 只接受全小写的镜像名，而本仓库 owner 是 Tuluobo。
      # metadata-action 的 images 会自己转小写，但下面 cache 的 ref 是原样字符串，
      # 所以这里统一算一次，两处共用，避免只改了一处而另一处推不上去。
      - name: Resolve lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # metadata-action 写入的 org.opencontainers.image.source 标签会把 package
      # 关联回本仓库，让 package 页面继承仓库的权限设置。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 镜像里的版本号必须是真实 tag，否则后台「当前版本」显示的是
          # Dockerfile 里的占位值 v1.0.0，版本检测会一直提示有新版本。
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-{0}', github.sha) }}
          # 缓存放在 GHCR 自己的一个 buildcache tag 里，而不是 type=gha。
          # Actions 缓存服务换代后，buildkit 往 type=gha 写层会报
          # "error writing layer blob: not_found"，镜像明明推成功了却让整个 job 变红。
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: false
